# =============================================================================
# after/e/ blueprint — Immich OIDC
# =============================================================================
# Immich needs several redirect URIs: the web callback, the user-settings page,
# and the MOBILE app scheme (app.immich:///oauth-callback) or phone logins fail.
# Immich requires a signed (RS256) id_token; signing_key is set, encryption_key
# is deliberately omitted (no JWE). VERIFY the redirect URIs against Immich's
# current OIDC docs — they have drifted between releases.
# =============================================================================
version: 1
metadata:
  name: aftere-app-immich
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: aftere-oidc-immich
    state: present
    identifiers:
      name: aftere-immich
    attrs:
      client_type: confidential
      client_id: immich
      client_secret: !Env OIDC_IMMICH_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      include_claims_in_id_token: true
      access_code_validity: "minutes=1"
      access_token_validity: "hours=1"
      refresh_token_validity: "days=30"
      redirect_uris:
        - url: !Format ["https://immich.%s/auth/login", !Env AFTERE_DOMAIN]
          matching_mode: strict
        - url: !Format ["https://immich.%s/user-settings", !Env AFTERE_DOMAIN]
          matching_mode: strict
        - url: "app.immich:///oauth-callback"
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "aftere email (verified=true)"]]

  - model: authentik_core.application
    id: aftere-app-immich
    state: present
    identifiers:
      slug: immich
    attrs:
      name: Immich
      provider: !KeyOf aftere-oidc-immich
      policy_engine_mode: any
      meta_launch_url: !Format ["https://immich.%s", !Env AFTERE_DOMAIN]
