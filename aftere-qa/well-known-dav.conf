# after/e/ — route CalDAV/CardDAV service discovery to Nextcloud.
# ---------------------------------------------------------------------------
# WHERE: place on the box at  $AFTERE_CONFIG/nginx/snippets/well-known-dav.conf
#        (mounts read-only into the nginx container at /etc/nginx/snippets/)
# WIRE:  add ONE line inside the APEX vhost's 443 server block —
#        file:  $AFTERE_CONFIG/nginx/conf.d/<your-domain>.conf
#        add:   include /etc/nginx/snippets/well-known-dav.conf;
#        (put it just above the `location / { proxy_pass ... }` line)
# APPLY: docker compose exec nginx nginx -t && docker compose exec nginx nginx -s reload
# ---------------------------------------------------------------------------
# WHY exact-match (`location =`): it takes precedence over the vhost's catch-all
# `location /` proxy, so ONLY these discovery paths are intercepted; everything
# else still proxies to Nextcloud untouched. Nextcloud's DAV entry point is
# /remote.php/dav/ ; the 301 is client-facing, the client re-requests that path,
# and nginx proxies it through to NC as normal.
#
# This is the piece that makes /e/OS (DAVx5) find calendars+contacts in
# NEXTCLOUD, not in Stalwart. Pair it with nextcloud-proxy-fix.sh so NC emits
# correct https://<domain> URLs in its PROPFIND responses.

location = /.well-known/caldav  { return 301 /remote.php/dav/; }
location = /.well-known/carddav { return 301 /remote.php/dav/; }

# Optional (harmless; Nextcloud best-practice for federation/profile lookups —
# not needed for the phone/DAV test, safe to keep or delete):
location = /.well-known/webfinger { return 301 /index.php/.well-known/webfinger; }
location = /.well-known/nodeinfo  { return 301 /index.php/.well-known/nodeinfo; }
