# =============================================================================
# after-e- blueprint — Nextcloud OIDC
# =============================================================================
# Redirect URI assumes the official `user_oidc` Nextcloud app. If postinstall
# installs `oidc_login` instead, the URI changes to /apps/oidc_login/oidc —
# they MUST match whatever postinstall configures. (VERIFY AT QA.)
#
# sub_mode: hashed_user_id -> the OIDC subject is derived from the internal
# user PK, NOT the email. That's deliberate: it stays stable when the email
# domain changes at cutover, which is exactly the migration identity-stability
# invariant. Apps key accounts off `sub`; keep it domain-independent.
# =============================================================================
version: 1
metadata:
  name: aftere-app-nextcloud
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: aftere-oidc-nextcloud
    state: present
    identifiers:
      name: aftere-nextcloud
    attrs:
      client_type: confidential
      client_id: nextcloud
      client_secret: !Env OIDC_NEXTCLOUD_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      include_claims_in_id_token: true
      access_code_validity: "minutes=1"
      access_token_validity: "hours=1"
      refresh_token_validity: "days=30"
      redirect_uris:
        - url: !Format ["https://%s/apps/user_oidc/code", !Env AFTERE_DOMAIN]
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "aftere email (verified=true)"]]

  - model: authentik_core.application
    id: aftere-app-nextcloud
    state: present
    identifiers:
      slug: nextcloud
    attrs:
      name: Nextcloud
      provider: !KeyOf aftere-oidc-nextcloud
      policy_engine_mode: any
      meta_launch_url: !Format ["https://%s", !Env AFTERE_DOMAIN]
